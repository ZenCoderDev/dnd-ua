services:
  postgres:
    image: postgres:15
    container_name: dnd_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dnddb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nextjs:
    image: ghcr.io/zencoderdev/tbdices-next:latest
    container_name: tbdices_next
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["npm", "run", "start"]

  prisma:
    image: ghcr.io/zencoderdev/tbdices-prisma:latest
    container_name: prisma_studio
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "5555:5555"
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none"]

volumes:
  postgres_data:
