name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: zencoderdev

permissions:
  contents: read
  packages: write

jobs:
  build_and_copy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and push Next.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.next
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/tbdices-next:latest

      - name: Build and push Prisma image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prisma
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/tbdices-prisma:latest

      - name: Copy build to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.prod.yml"
          target: /var/www/tbdices_com_usr/data/www/tbdices.com
          strip_components: 0

  deploy:
    runs-on: ubuntu-22.04
    needs: build_and_copy
    steps:
    - name: Deploy on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          set -e
          cd /var/www/tbdices_com_usr/data/www/tbdices.com

          echo "==> Docker login..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "==> Pull latest images..."
          docker compose -f docker-compose.prod.yml pull


          echo "✅ Deploy completed!"